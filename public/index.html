<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ec">
  <meta name="description" content="Search YouTube and watch videos in a privacy-enhanced embedded player.">
  <title>Anon Watcher | Search and watch</title>
  <link rel="canonical" href="https://github.io">
  <link rel="stylesheet" href="app.css">
  <script defer src="https://umami.is" data-website-id="9cc28547-9734-4c45-9873-7d4c90eaea20"></script>
</head>
<body>
  <!-- Main application shell containing search, video player, and library components -->
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Anon Watcher home">
        <span>anon watcher</span>
      </a>
      <div class="top-actions">
        <button class="header-button" id="library-button" type="button">Library</button>
        <button class="header-button" id="settings-button" type="button">Settings</button>
      </div>
    </header>
    <main>
      <section class="unified-search" aria-label="Search or play media">
        <form id="unified-form" class="unified-form" role="search">
          <input id="unified-input" name="query" type="search" placeholder="Search YouTube or paste a link / video ID" required>
          <button class="watch-button" type="submit">Go</button>
        </form>
      </section>
      <section class="watcher" id="watcher" aria-label="Video player">
        <div class="player-wrap" id="player-wrap">
          <iframe id="youtube-player" title="YouTube video" hidden></iframe>
          <video id="media-player" preload="metadata" playsinline controls hidden></video>
          <div class="empty-player" id="empty-player">
            <p>Paste a YouTube link or search for a video to get started.</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="/vendor/hls.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
